services:
  web:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: examplepassword
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - app-network

  worker:
    image: busybox:latest
    command: sh -c 'while true; do echo "Worker $$(hostname) is working"; sleep 5; done'
    networks:
      - app-network

networks:
  app-network:

volumes:
  db-data:
